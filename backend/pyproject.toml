[project]
name = "geomeasure"
version = "0.1.0"
description = "Measure area and length of features in KML and Shapefile uploads"
authors = [
    { name = "Prathu3110", email = "170416389+Prathu3110@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.2.0",
    "psycopg[binary]>=3.3.6",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
