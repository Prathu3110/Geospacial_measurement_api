[project]
name = "geomeasure"
version = "0.1.0"
description = "Measure area and length of features in KML and Shapefile uploads"
authors = [
    { name = "Prathu3110", email = "170416389+Prathu3110@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
