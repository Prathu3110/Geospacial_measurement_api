server {
    listen 80;
    root /usr/share/nginx/html;

    # Proxy the API on the same origin, so the browser needs no CORS rules.
    location /api/ {
        proxy_pass http://api:8000;
        client_max_body_size 50m;
    }

    # Swagger UI and its schema, so the footer link works in Docker too.
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
